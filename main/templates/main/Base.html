<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Мій сайт{% endblock %}</title>
    <style>
        body { font-family: sans-serif; margin: 0; padding: 0; }
        header { background: #333; color: #fff; padding: 1rem; }
        nav a { color: #fff; margin-right: 15px; text-decoration: none; }
        main { padding: 20px; min-height: 400px; }
        footer { background: #eee; padding: 10px; text-align: center; }
    </style>
</head>
<body>

    <header>
        <h1>Назва мого проекту</h1>
        <nav>
            <a href="/">Головна</a>
            <a href="/about">Про сайт</a>
        </nav>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer>
        <p>&copy; 2026 Всі права захищені</p>
    </footer>

</body>
</html>
